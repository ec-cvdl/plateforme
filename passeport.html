<!DOCTYPE html>
<html lang="fr">
<head>
<script>
// 👉 C'EST ICI, LA LIGNE JUSTE EN DESSOUS ↓↓↓ — remplace UNIQUEMENT le texte entre guillemets
const API = 'https://europe-west1-cvdl-plateforme.cloudfunctions.net/cvdl-api';
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passeport de l'appareil — CVDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260802-2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .passeport{max-width:480px;margin:0 auto}
  .passeport h1{margin-top:0;font-size:21px}
  .carte-passeport{
    background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:24px;margin-top:18px;
  }
  .ligne-passeport{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--trait)}
  .ligne-passeport:last-child{border-bottom:none}
  .ligne-passeport .cle{font-size:12.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
  .ligne-passeport .valeur{font-size:14.5px;color:var(--encre);font-weight:600;text-align:right}
  .badge-garantie{
    display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
    font-size:12.5px;font-weight:600;
  }
  .badge-garantie.sous{background:rgba(46,160,90,.12);color:#2EA05A}
  .badge-garantie.hors{background:rgba(230,36,96,.12);color:var(--rose,#E62460)}
  .bloc-sav{margin-top:10px}
  .ticket-sav-mini{
    display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--trait);font-size:13px;
  }
  .ticket-sav-mini:last-child{border-bottom:none}
  .recherche-passeport{display:flex;gap:8px;margin-bottom:8px}
  .recherche-passeport input{flex:1}
  .etat-passeport{text-align:center;padding:40px 20px;color:var(--gris)}
  .lien-mode-admin{display:block;text-align:center;font-size:12px;color:var(--gris);margin-top:14px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
  .lien-support-passeport{
    display:block;text-align:center;font-size:13px;font-weight:600;color:var(--primaire);
    text-decoration:none;margin-top:18px;padding:12px;border:1px solid var(--trait);border-radius:10px;
  }
  .lien-support-passeport:hover{background:var(--carte)}
</style>
</head>
<body>
<a href="#contenu-principal" class="lien-evitement">Aller au contenu</a>

<header class="marque-barre">
  <div class="marque">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <span class="nom-org">CVDL</span>
  </div>
  <div class="bascule-mode" role="group" aria-label="Apparence de la page">
    <button type="button" data-mode="clair" class="actif">Clair</button>
    <button type="button" data-mode="accessible">Accessible</button>
  </div>
</header>

<div class="scene-wrap" id="contenu-principal">
  <div class="scene passeport">

    <h1>🛂 Passeport de l'appareil</h1>

    <div id="etape-identification">
      <p class="sous-question">Ce passeport est réservé aux structures partenaires — identifiez-vous avec votre code habituel.</p>
      <div class="recherche-passeport">
        <input type="text" id="champ-code-structure" class="champ-texte" placeholder="Code structure" autocomplete="off" spellcheck="false">
        <button type="button" class="bouton-principal" id="btn-identifier-structure" style="width:auto;padding:0 18px">Continuer</button>
      </div>
      <div id="retour-identification"></div>
      <button type="button" class="lien-mode-admin" id="btn-mode-admin">Vous êtes de l'équipe CVDL ?</button>
      <div id="zone-mode-admin" hidden style="margin-top:10px">
        <div class="recherche-passeport">
          <input type="password" id="champ-mot-de-passe-admin" class="champ-texte" placeholder="Mot de passe admin" autocomplete="off">
          <button type="button" class="bouton-principal" id="btn-identifier-admin" style="width:auto;padding:0 18px">Continuer</button>
        </div>
      </div>
    </div>

    <div id="etape-recherche" hidden>
      <p class="sous-question" id="intro-passeport">Numéro de série collé sur l'étiquette de l'appareil, ou scanné depuis le QR code.</p>
      <div class="recherche-passeport">
        <input type="text" id="champ-numero-serie" class="champ-texte" placeholder="Numéro de série" autocomplete="off" spellcheck="false">
        <button type="button" class="bouton-principal" id="btn-chercher-passeport" style="width:auto;padding:0 18px">Voir</button>
      </div>
      <div id="zone-passeport"></div>
      <a href="https://cvdl.example.org/support" target="_blank" rel="noopener" class="lien-support-passeport">💬 Besoin d'aide avec cet appareil ? Contactez le support</a>
      <button type="button" class="lien-mode-admin" id="btn-deconnexion-passeport">Déconnexion</button>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);
function echapper(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function poster(data){
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(data) }).then(r => r.json());
}

/* ─── Identification : code structure ou mot de passe admin, tous deux persistés en
   sessionStorage — le temps de l'onglet, effacés par le bouton Déconnexion. ─── */
let codeIdentifie = '';
let motDePasseAdminIdentifie = '';

function passerAEtapeRecherche(){
  $('etape-identification').hidden = true;
  $('etape-recherche').hidden = false;
  const depuisUrl = new URLSearchParams(location.search).get('sn');
  if(depuisUrl){
    $('champ-numero-serie').value = depuisUrl;
    afficherPasseport(depuisUrl);
  }
}

$('btn-mode-admin').addEventListener('click', () => {
  $('zone-mode-admin').hidden = !$('zone-mode-admin').hidden;
  if(!$('zone-mode-admin').hidden) $('champ-mot-de-passe-admin').focus();
});

$('btn-identifier-structure').addEventListener('click', () => {
  const code = $('champ-code-structure').value.trim();
  if(!code) return;
  codeIdentifie = code;
  try{ sessionStorage.setItem('cvdl-code-structure', code); }catch(e){}
  passerAEtapeRecherche();
});
$('champ-code-structure').addEventListener('keydown', e => { if(e.key === 'Enter') $('btn-identifier-structure').click(); });

$('btn-identifier-admin').addEventListener('click', () => {
  const mdp = $('champ-mot-de-passe-admin').value;
  if(!mdp) return;
  motDePasseAdminIdentifie = mdp;
  try{ sessionStorage.setItem('cvdl-passeport-admin', mdp); }catch(e){}
  passerAEtapeRecherche();
});
$('champ-mot-de-passe-admin').addEventListener('keydown', e => { if(e.key === 'Enter') $('btn-identifier-admin').click(); });

// Déjà identifiée sur cet appareil (venant d'une autre page du portail structure, ou d'un
// précédent passage ici) : on saute directement l'étape d'identification. Priorité au code
// passé dans l'URL (lien "confort" ouvert depuis une page déjà authentifiée) sur celui
// mémorisé en sessionStorage, au cas où une autre structure vient de se connecter sur ce même
// onglet entre-temps.
const codeDepuisUrl = new URLSearchParams(location.search).get('code');
if(codeDepuisUrl){
  codeIdentifie = codeDepuisUrl;
  try{ sessionStorage.setItem('cvdl-code-structure', codeDepuisUrl); }catch(e){}
  // Le code ne doit pas traîner visible dans la barre d'adresse une fois consommé.
  const urlNettoyee = new URL(location.href);
  urlNettoyee.searchParams.delete('code');
  history.replaceState(null, '', urlNettoyee.pathname + urlNettoyee.search);
  passerAEtapeRecherche();
}else{
  try{
    const codeMemorise = sessionStorage.getItem('cvdl-code-structure');
    const motDePasseMemorise = sessionStorage.getItem('cvdl-passeport-admin');
    if(codeMemorise){ codeIdentifie = codeMemorise; passerAEtapeRecherche(); }
    else if(motDePasseMemorise){ motDePasseAdminIdentifie = motDePasseMemorise; passerAEtapeRecherche(); }
  }catch(e){}
}

$('btn-deconnexion-passeport').addEventListener('click', () => {
  try{ sessionStorage.removeItem('cvdl-code-structure'); sessionStorage.removeItem('cvdl-passeport-admin'); }catch(e){}
  codeIdentifie = ''; motDePasseAdminIdentifie = '';
  $('champ-code-structure').value = ''; $('champ-mot-de-passe-admin').value = '';
  $('zone-passeport').innerHTML = ''; $('champ-numero-serie').value = '';
  $('etape-recherche').hidden = true;
  $('etape-identification').hidden = false;
});

async function afficherPasseport(numeroSerie){
  $('zone-passeport').innerHTML = '<p class="etat-passeport">Recherche en cours…</p>';
  try{
    const r = await poster({ action:'passeport-materiel', numeroSerie, code: codeIdentifie, password: motDePasseAdminIdentifie });
    if(!r.ok){
      if(r.identificationRequise){
        // Le code ou le mot de passe s'est avéré invalide (ou a été révoqué depuis) : on
        // revient à l'identification.
        try{ sessionStorage.removeItem('cvdl-code-structure'); sessionStorage.removeItem('cvdl-passeport-admin'); }catch(e){}
        codeIdentifie = ''; motDePasseAdminIdentifie = '';
        $('etape-recherche').hidden = true;
        $('etape-identification').hidden = false;
        $('retour-identification').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur)}</div>`;
        return;
      }
      $('zone-passeport').innerHTML = `<p class="etat-passeport">${echapper(r.erreur || "Numéro de série introuvable.")}<br>Vérifiez la saisie, ou contactez la structure qui vous a remis l'appareil.</p>`;
      return;
    }

    const badgeGarantie = r.sousGarantie === null ? ''
      : r.sousGarantie
        ? `<span class="badge-garantie sous">✓ Sous garantie jusqu'au ${echapper(r.dateFinGarantie)}</span>`
        : `<span class="badge-garantie hors">Hors garantie depuis le ${echapper(r.dateFinGarantie)}</span>`;

    // reconditionneurOriginal / donateur ne sont présents dans la réponse que pour les
    // structures ESN et l'admin — absents (pas juste vides) pour tout le monde d'autre.
    const infosCompletes = r.reconditionneurOriginal !== undefined;

    $('zone-passeport').innerHTML = `
      <div class="carte-passeport">
        <div class="ligne-passeport"><span class="cle">N° de série</span><span class="valeur">${echapper(r.numeroSerie)}</span></div>
        ${r.caracteristiques ? `<div class="ligne-passeport"><span class="cle">Configuration</span><span class="valeur">${echapper(r.caracteristiques)}</span></div>` : ''}
        ${r.structure ? `<div class="ligne-passeport"><span class="cle">Remis par</span><span class="valeur">${echapper(r.structure)}</span></div>` : ''}
        ${r.dateLivraison ? `<div class="ligne-passeport"><span class="cle">Livré le</span><span class="valeur">${echapper(r.dateLivraison)}</span></div>` : ''}
        ${r.nomPersonne ? `<div class="ligne-passeport"><span class="cle">Utilisé par</span><span class="valeur">${echapper(r.nomPersonne)}</span></div>` : ''}
        ${badgeGarantie ? `<div class="ligne-passeport"><span class="cle">Garantie</span><span class="valeur">${badgeGarantie}</span></div>` : ''}
        ${infosCompletes ? `<div class="ligne-passeport"><span class="cle">Reconditionneur</span><span class="valeur">${r.reconditionneurOriginal ? echapper(r.reconditionneurOriginal) : '—'}</span></div>` : ''}
        ${infosCompletes ? `<div class="ligne-passeport"><span class="cle">Donateur</span><span class="valeur">${r.donateur ? echapper(r.donateur) : '—'}</span></div>` : ''}
        ${infosCompletes && r.statutAppareil ? `<div class="ligne-passeport"><span class="cle">Statut</span><span class="valeur">${echapper(r.statutAppareil)}</span></div>` : ''}
      </div>
      ${r.historique && r.historique.length ? `
      <div class="carte-passeport">
        <div class="ligne-passeport"><span class="cle">Historique de l'appareil</span></div>
        ${r.historique.map(h => `
          <div class="ticket-sav-mini">
            <span>${echapper(h.label)}</span>
            <span style="color:var(--gris)">${echapper(h.date)}</span>
          </div>`).join('')}
      </div>` : ''}
      ${infosCompletes ? `
      <div class="carte-passeport" style="text-align:center">
        <div id="qr-code-passeport-admin" style="display:flex;justify-content:center;margin-bottom:12px"></div>
        <button type="button" class="bouton-principal" id="btn-imprimer-etiquette-admin" style="width:auto;padding:0 18px">🖨️ Imprimer l'étiquette</button>
      </div>` : ''}
    `;

    if(infosCompletes){
      $('qr-code-passeport-admin').innerHTML = '';
      try{ new QRCode($('qr-code-passeport-admin'), { text: location.href.split('?')[0] + '?sn=' + encodeURIComponent(r.numeroSerie), width: 180, height: 180, colorDark: '#161B22', colorLight: '#ffffff' }); }catch(e){}
      $('btn-imprimer-etiquette-admin').addEventListener('click', () => {
        const fenetre = window.open('', '_blank', 'width=400,height=500');
        fenetre.document.write(`<!DOCTYPE html><html><head><title>Étiquette ${r.numeroSerie}</title><style>
          body{font-family:sans-serif;text-align:center;padding:20px}
          .num{font-family:monospace;font-size:13px;word-break:break-all}
        </style></head><body>
          <div>${$('qr-code-passeport-admin').innerHTML}</div>
          <div class="num">${r.numeroSerie}</div>
          <script>window.onload = () => { window.print(); }<\/script>
        </body></html>`);
        fenetre.document.close();
      });
    }
  }catch(e){
    $('zone-passeport').innerHTML = '<p class="etat-passeport">Impossible de récupérer les informations — réessayez.</p>';
  }
}

$('btn-chercher-passeport').addEventListener('click', () => {
  const v = $('champ-numero-serie').value.trim();
  if(v){ history.replaceState(null, '', '?sn=' + encodeURIComponent(v)); afficherPasseport(v); }
});
$('champ-numero-serie').addEventListener('keydown', e => { if(e.key === 'Enter') $('btn-chercher-passeport').click(); });

/* Bascule de mode (clair / accessible) */
function appliquerMode(mode){
  document.body.classList.remove('mode-sombre','mode-accessible');
  if(mode === 'accessible') document.body.classList.add('mode-accessible');
  $$('.bascule-mode button').forEach(b => b.classList.toggle('actif', b.dataset.mode === mode));
  try{ localStorage.setItem('cvdl-mode', mode); }catch(e){}
}
$$('.bascule-mode button').forEach(b => b.addEventListener('click', () => appliquerMode(b.dataset.mode)));
try{
  const memorise = localStorage.getItem('cvdl-mode');
  if(memorise) appliquerMode(memorise === 'sombre' ? 'clair' : memorise);
}catch(e){}
</script>
</body>
</html>

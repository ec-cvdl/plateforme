<!DOCTYPE html>
<html lang="fr">
<head>
<script>
// 👉 C'EST ICI, LA LIGNE JUSTE EN DESSOUS ↓↓↓ — remplace UNIQUEMENT le texte entre guillemets
// ⚠️ Depuis la migration vers Cloud Functions : colle ici l'URL de ta fonction déployée
// (celle donnée par `gcloud functions deploy`), PAS l'URL Apps Script en .../exec
const API = 'https://europe-west1-cvdl-plateforme.cloudfunctions.net/cvdl-api';
// 👆 C'ÉTAIT ICI — fais la même chose dans admin.html, commande.html, sav.html, sav-beneficiaire.html, suivi.html, suivi-sav-structure.html, suivi-sav-beneficiaire.html, flotte-structure.html et portail-structure.html
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre avis — CVDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260802-2">
<style>
  .notation{display:flex;gap:8px;margin-top:8px}
  .notation button{
    flex:1;padding:12px 0;border:1.5px solid var(--trait);border-radius:10px;background:var(--carte);
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--gris);transition:all .15s;
  }
  .notation button:hover{border-color:var(--primaire)}
  .notation button.actif{border-color:var(--primaire);background:var(--primaire);color:#fff}
  .bloc-question{margin-bottom:26px}
  .bloc-question label.titre-question{font-weight:600;font-size:14.5px;color:var(--encre);display:block;margin-bottom:2px}
  .legende-notation{display:flex;justify-content:space-between;font-size:11px;color:var(--gris);margin-top:4px}
</style>
</head>
<body>
<a href="#contenu-principal" class="lien-evitement">Aller au contenu</a>

<header class="marque-barre">
  <div class="marque">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <span class="nom-org">CVDL — Votre avis compte</span>
  </div>
  <div class="bascule-mode" role="group" aria-label="Apparence de la page">
    <button type="button" data-mode="clair" class="actif">Clair</button>
    <button type="button" data-mode="accessible">Accessible</button>
  </div>
</header>

<div class="scene-wrap" id="contenu-principal">
  <div class="scene" id="scene">

    <div id="etape-formulaire">
      <h1 style="margin-top:0">Comment s'est passée votre commande ?</h1>
      <p class="sous-question" id="reference-affichee"></p>

      <div class="bloc-question">
        <label class="titre-question">Globalement, êtes-vous satisfait·e ?</label>
        <div class="notation" data-note="noteGlobale">
          <button type="button" data-valeur="1">1</button>
          <button type="button" data-valeur="2">2</button>
          <button type="button" data-valeur="3">3</button>
          <button type="button" data-valeur="4">4</button>
          <button type="button" data-valeur="5">5</button>
        </div>
        <div class="legende-notation"><span>Pas du tout</span><span>Tout à fait</span></div>
      </div>

      <div class="bloc-question">
        <label class="titre-question">Le délai de livraison vous a-t-il convenu ?</label>
        <div class="notation" data-note="noteDelai">
          <button type="button" data-valeur="1">1</button>
          <button type="button" data-valeur="2">2</button>
          <button type="button" data-valeur="3">3</button>
          <button type="button" data-valeur="4">4</button>
          <button type="button" data-valeur="5">5</button>
        </div>
        <div class="legende-notation"><span>Pas du tout</span><span>Tout à fait</span></div>
      </div>

      <div class="bloc-question">
        <label class="titre-question">Que pensez-vous de l'état du matériel reçu ?</label>
        <div class="notation" data-note="noteMateriel">
          <button type="button" data-valeur="1">1</button>
          <button type="button" data-valeur="2">2</button>
          <button type="button" data-valeur="3">3</button>
          <button type="button" data-valeur="4">4</button>
          <button type="button" data-valeur="5">5</button>
        </div>
        <div class="legende-notation"><span>Décevant</span><span>Excellent</span></div>
      </div>

      <div class="bloc-question">
        <label class="titre-question" for="commentaire">Une remarque à ajouter ? (facultatif)</label>
        <textarea id="commentaire" rows="4" placeholder="Dites-nous ce qui a bien ou moins bien fonctionné…" style="margin-top:8px"></textarea>
      </div>

      <div id="retour-enquete"></div>
      <button type="button" class="bouton-principal" id="btn-envoyer-enquete" style="margin-top:10px">Envoyer mon avis</button>
    </div>

    <div id="etape-merci" hidden style="text-align:center;padding:20px 0">
      <h1>Merci pour votre retour !</h1>
      <p class="sous-question">Votre avis a bien été enregistré et nous aide à améliorer le service.</p>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function echapper(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function poster(data){
  return fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(data)
  }).then(r => r.json());
}

const params = new URLSearchParams(location.search);
const reference = params.get('ref') || '';
$('reference-affichee').textContent = reference ? `Commande ${reference}` : '';

const notes = {};
$$('.notation').forEach(groupe => {
  const cle = groupe.dataset.note;
  groupe.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      notes[cle] = b.dataset.valeur;
      groupe.querySelectorAll('button').forEach(x => x.classList.toggle('actif', x === b));
    });
  });
});

$('btn-envoyer-enquete').addEventListener('click', async () => {
  if(!reference){
    $('retour-enquete').innerHTML = '<div class="msg msg-erreur">Lien invalide — référence de commande manquante.</div>';
    return;
  }
  $('btn-envoyer-enquete').disabled = true;
  $('btn-envoyer-enquete').textContent = 'Envoi…';
  try{
    const r = await poster({
      action: 'enquete-repondre',
      reference: reference,
      noteGlobale: notes.noteGlobale || '',
      noteDelai: notes.noteDelai || '',
      noteMateriel: notes.noteMateriel || '',
      commentaire: $('commentaire').value.trim()
    });
    if(r.ok){
      $('etape-formulaire').hidden = true;
      $('etape-merci').hidden = false;
    }else{
      $('retour-enquete').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur || 'Envoi impossible.')}</div>`;
      $('btn-envoyer-enquete').disabled = false;
      $('btn-envoyer-enquete').textContent = 'Envoyer mon avis';
    }
  }catch(e){
    $('retour-enquete').innerHTML = '<div class="msg msg-erreur">Envoi impossible — réessaie.</div>';
    $('btn-envoyer-enquete').disabled = false;
    $('btn-envoyer-enquete').textContent = 'Envoyer mon avis';
  }
});

/* Bascule de mode (clair / accessible) */
function appliquerMode(mode){
  document.body.classList.remove('mode-sombre','mode-accessible');
  if(mode === 'accessible') document.body.classList.add('mode-accessible');
  $$('.bascule-mode button').forEach(b => b.classList.toggle('actif', b.dataset.mode === mode));
  try{ localStorage.setItem('cvdl-mode', mode); }catch(e){}
}
$$('.bascule-mode button').forEach(b => b.addEventListener('click', () => appliquerMode(b.dataset.mode)));
try{
  const memorise = localStorage.getItem('cvdl-mode');
  if(memorise) appliquerMode(memorise === 'sombre' ? 'clair' : memorise);
}catch(e){}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<script>
// 👉 C'EST ICI, LA LIGNE JUSTE EN DESSOUS ↓↓↓ — remplace UNIQUEMENT le texte entre guillemets
// ⚠️ Depuis la migration vers Cloud Functions : colle ici l'URL de ta fonction déployée
// (celle donnée par `gcloud functions deploy`), PAS l'URL Apps Script en .../exec
const API = 'https://europe-west1-cvdl-plateforme.cloudfunctions.net/cvdl-api';
// 👆 C'ÉTAIT ICI — fais la même chose dans admin.html, commande.html, sav.html, sav-beneficiaire.html, suivi.html, suivi-sav-beneficiaire.html, flotte-structure.html, enquete-satisfaction.html et portail-structure.html
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de mes demandes SAV — CVDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260802-2">
<style>
  .liste-tickets-suivi{display:flex;flex-direction:column;gap:16px;margin-top:20px}
  .carte-ticket-suivi{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:18px 20px}
  .entete-ts{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .ref-ts{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--ink)}
  .date-ts{font-size:12.5px;color:var(--gris)}
  .symptome-ts{font-size:13.5px;color:var(--gris);margin-top:6px}
  .serie-ts{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gris);margin-top:3px}
  .anneau-sav-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
  .anneau-sav-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;color:var(--ink)}

  .statut-ts{
    display:inline-block;font-size:12px;font-weight:700;color:var(--ink);
    background:var(--papier);border:1px solid var(--trait);padding:6px 13px;border-radius:20px;
  }
  .liens-colissimo-ts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .liens-colissimo-ts a{
    font-size:12.5px;font-weight:600;color:var(--ink);background:var(--papier);border:1px solid var(--trait);
    text-decoration:none;padding:6px 12px;border-radius:20px;
  }
  .date-resolution-ts{font-size:12px;color:var(--gris);margin-top:10px}
  .notes-resolution-ts{
    font-size:13px;color:var(--ink);background:var(--papier);border:1px solid var(--trait);
    border-radius:10px;padding:12px 14px;margin-top:12px;line-height:1.5;
  }
  .btn-historique-ts{
    font-size:12px;font-weight:600;color:var(--gris);background:none;border:none;
    text-decoration:underline;cursor:pointer;padding:10px 0 0;
  }
  .historique-ts{margin-top:8px;padding-left:14px;border-left:2px solid var(--trait)}
  .historique-ts-ligne{font-size:12px;color:var(--gris);padding:4px 0}
  .historique-ts-date{font-family:'IBM Plex Mono',monospace;margin-right:8px;color:var(--ink)}

  body.mode-sombre .carte-ticket-suivi{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15)}
  body.mode-sombre .ref-ts{color:#fff}
  body.mode-sombre .statut-ts{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
  body.mode-sombre .liens-colissimo-ts a{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
</style>
<script>
// Si un code est déjà mémorisé sur cet appareil, on masque l'étape de saisie AVANT même
// qu'elle ne s'affiche (pas de flash) — un voile de chargement neutre prend sa place le temps
// que la vérification se termine en arrière-plan.
try{
  if(sessionStorage.getItem('cvdl-code-structure')) document.documentElement.classList.add('deja-identifie');
}catch(e){}
</script>
<style>
  html.deja-identifie #etape-code{display:none !important}
  html.deja-identifie #voile-verification-precoce{display:flex}
  #voile-verification-precoce{
    display:none;position:fixed;inset:0;z-index:9999;background:#fff;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;
  }
  #voile-verification-precoce .spinner-precoce{
    width:34px;height:34px;border:3px solid #E2E6EA;border-top-color:#222;border-radius:50%;
    animation:tourner-spinner-precoce .8s linear infinite;
  }
  @keyframes tourner-spinner-precoce{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>
<a href="#contenu-principal" class="lien-evitement">Aller au contenu</a>

<div class="barre-retour-portail">
  <a href="portail-structure.html" class="lien-retour-portail">← Retour portail</a>
</div>

<header class="marque-barre">
  <div class="marque">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <span class="nom-org">CVDL — Suivi SAV structure</span>
  </div>
  <div class="bascule-mode" role="group" aria-label="Apparence de la page">
    <button type="button" data-mode="clair" class="actif">Clair</button>
    <button type="button" data-mode="accessible">Accessible</button>
  </div>
</header>

<div class="scene-wrap" id="contenu-principal">
  <div class="scene" id="scene">

    <!-- Étape : identification -->
    <section id="etape-code">
      <div class="question">Quel est votre <em>code structure</em> ?</div>
      <p class="sous-question">
        Le même code que pour commander ou suivre une commande. Vous êtes bénéficiaire sans code ?
        <a href="suivi-sav-beneficiaire.html">Suivez votre demande ici</a>.
      </p>
      <label for="code-structure" class="sr-only">Code structure</label>
      <input type="text" class="champ-texte" id="code-structure" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      <div id="retour-code" aria-live="polite"></div>
      <div class="suite">
        <button type="button" class="bouton-principal" id="btn-voir-tickets">Voir le suivi →</button>
      </div>
    </section>

    <!-- Étape : liste des tickets -->
    <section id="etape-liste" hidden>
      <div class="question" id="titre-structure"></div>
      <p class="sous-question" id="nb-tickets-texte"></p>
      <div class="liste-tickets-suivi" id="liste-tickets-suivi"></div>
      <div class="suite">
        <button type="button" class="bouton-principal" id="btn-autre-code" style="background:transparent;color:var(--gris);border:1.5px solid var(--trait)">Consulter un autre code</button>
      </div>
    </section>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function appliquerMode(mode){
  document.body.className = mode === 'clair' ? '' : 'mode-' + mode;
  document.querySelectorAll('.bascule-mode button').forEach(b => b.classList.toggle('actif', b.dataset.mode === mode));
  localStorage.setItem('cvdl-mode', mode);
}
document.querySelectorAll('.bascule-mode button').forEach(b => {
  b.addEventListener('click', () => appliquerMode(b.dataset.mode));
});
try{
  const memorise = localStorage.getItem('cvdl-mode');
  if(memorise) appliquerMode(memorise === 'sombre' ? 'clair' : memorise); // le mode sombre a été retiré (à retravailler plus tard) : quelqu'un qui l'avait choisi avant repasse en clair, plutôt que de rester coincé sans bouton pour en sortir
}catch(e){}

function echapper(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function afficherMsg(id, texte, type){
  $(id).innerHTML = texte ? `<div class="msg msg-${type}">${echapper(texte)}</div>` : '';
}

function jsonp(params){
  return fetch(API + '?' + new URLSearchParams(params)).then(r => r.json());
}

/* Mêmes teintes que le back-office, pour que la couleur du statut reste cohérente partout */
const TEINTES_SAV = {
  't-ambre':     { fond:'#FFF3DB', texte:'#8A5A00' },
  't-bleu':      { fond:'#DCE7FA', texte:'#1D4ED8' },
  't-violet':    { fond:'#F1E4F7', texte:'#6B2E8C' },
  't-turquoise': { fond:'#DCF3F2', texte:'#0A6E6B' },
  't-vert':      { fond:'#E2F0EA', texte:'#1B6B4F' },
  't-rouge':     { fond:'#FBE1DD', texte:'#A3311C' },
  't-gris':      { fond:'#ECEEF0', texte:'#65727E' }
};
let statutsSavPublic = [];

function construireAnneauSav(statutActuel){
  if(!statutsSavPublic.length) return '';
  const statutCourant = statutsSavPublic.find(s => s.statut === statutActuel);
  if(!statutCourant) return '';
  const teinte = TEINTES_SAV[statutCourant.couleur] || TEINTES_SAV['t-gris'];
  const circonference = 2 * Math.PI * 24;

  const parcours = statutsSavPublic.filter(s => !s.terminal || s.finCycle);
  const estSortieAlternative = statutCourant.terminal && !statutCourant.finCycle;

  let progression, libellePct;
  if(estSortieAlternative){
    progression = 1;
    libellePct = '—';
  }else if(statutCourant.finCycle){
    progression = 1;
    libellePct = '✓';
  }else{
    const indexActuel = parcours.findIndex(s => s.statut === statutActuel);
    const total = parcours.length;
    progression = total ? (indexActuel + 1) / total : 0;
    libellePct = `${indexActuel + 1}/${total}`;
  }

  const decalage = circonference * (1 - progression);
  return `<div class="anneau-sav-wrap">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="24" fill="none" stroke="var(--trait)" stroke-width="6"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke="${teinte.texte}" stroke-width="6"
        stroke-dasharray="${circonference.toFixed(1)}" stroke-dashoffset="${decalage.toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 28 28)"/>
    </svg>
    <div class="anneau-sav-pct">${libellePct}</div>
  </div>`;
}

function rendreTicketsSuivi(tickets){
  if(!tickets.length){
    $('liste-tickets-suivi').innerHTML = `<p class="sous-question">Aucune demande SAV enregistrée pour ce code pour le moment.</p>`;
    return;
  }
  $('liste-tickets-suivi').innerHTML = tickets.map((t, i) => {
    const liensColissimo = String(t.colissimo || '').split('\n').map(s => s.trim()).filter(Boolean);
    const historique = t.historique || [];
    return `<div class="carte-ticket-suivi">
      <div class="entete-ts">
        <div class="ref-ts">${echapper(t.reference)}</div>
        <div class="date-ts">${echapper(t.date)}</div>
      </div>
      <div class="symptome-ts">${echapper(t.symptome || 'Symptôme non précisé')}</div>
      ${t.numeroSerie ? `<div class="serie-ts">N° série : ${echapper(t.numeroSerie)}</div>` : ''}
      <div style="display:flex;align-items:center;gap:14px;margin-top:12px">
        ${construireAnneauSav(t.statut)}
        <div class="statut-ts">${echapper(t.statut)}</div>
      </div>
      ${t.dateResolution ? `<div class="date-resolution-ts">Résolu le ${echapper(t.dateResolution)}</div>` : ''}
      ${t.notesResolution ? `<div class="notes-resolution-ts"><strong>Message de l'équipe :</strong><br>${echapper(t.notesResolution)}</div>` : ''}
      ${liensColissimo.length ? `<div class="liens-colissimo-ts">${liensColissimo.map(l =>
          `<a href="${echapper(l)}" target="_blank" rel="noopener">📦 Suivre le colis</a>`).join('')}</div>` : ''}
      ${historique.length ? `
        <button type="button" class="btn-historique-ts" data-toggle-historique="${i}">Voir l'historique (${historique.length})</button>
        <div class="historique-ts" id="historique-ts-${i}" hidden>
          ${historique.map(h => `<div class="historique-ts-ligne"><span class="historique-ts-date">${echapper(h.date)}</span>${echapper(h.statut)}</div>`).join('')}
        </div>` : ''}
    </div>`;
  }).join('');

  document.querySelectorAll('[data-toggle-historique]').forEach(b => {
    b.addEventListener('click', () => {
      const bloc = $('historique-ts-' + b.dataset.toggleHistorique);
      bloc.hidden = !bloc.hidden;
      b.textContent = (bloc.hidden ? 'Voir' : 'Masquer') + ' l\'historique (' + (bloc.children.length) + ')';
    });
  });
}

async function chargerTicketsSuivi(){
  const code = $('code-structure').value.trim();
  if(!code){ afficherMsg('retour-code', 'Merci de saisir un code.', 'erreur'); return; }

  $('btn-voir-tickets').disabled = true;
  $('btn-voir-tickets').innerHTML = '<span class="spinner-inline"></span>Recherche…';
  afficherMsg('retour-code', '', 'info');

  try{
    const [r, rStatuts] = await Promise.all([
      jsonp({ action: 'sav-par-code', code: code }),
      statutsSavPublic.length ? Promise.resolve({ ok: true, statuts: statutsSavPublic }) : jsonp({ action: 'sav-statuts-public' })
    ]);
    if(rStatuts.ok) statutsSavPublic = rStatuts.statuts.sort((a, b) => a.ordre - b.ordre);
    if(r.ok){
      $('titre-structure').textContent = r.nomStructure ? `Demandes SAV de ${r.nomStructure}` : 'Vos demandes SAV';
      $('nb-tickets-texte').textContent = r.tickets.length > 1
        ? `${r.tickets.length} demandes trouvées`
        : (r.tickets.length === 1 ? '1 demande trouvée' : '');
      rendreTicketsSuivi(r.tickets);
      $('etape-code').hidden = true;
      $('etape-liste').hidden = false;
      try{ sessionStorage.setItem('cvdl-code-structure', code); }catch(e){}
    }else{
      afficherMsg('retour-code', r.erreur || 'Code introuvable.', 'erreur');
    }
  }catch(e){
    afficherMsg('retour-code', 'Connexion impossible. Réessayez dans un instant.', 'erreur');
  }
  $('btn-voir-tickets').disabled = false;
  $('btn-voir-tickets').textContent = 'Voir le suivi →';
}

$('btn-voir-tickets').addEventListener('click', chargerTicketsSuivi);
$('code-structure').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); chargerTicketsSuivi(); } });

$('btn-autre-code').addEventListener('click', () => {
  try{ sessionStorage.removeItem('cvdl-code-structure'); }catch(e){}
  $('code-structure').value = '';
  $('retour-code').innerHTML = '';
  $('etape-liste').hidden = true;
  $('etape-code').hidden = false;
  $('code-structure').focus();
});

try{
  const codeMemorise = sessionStorage.getItem('cvdl-code-structure');
  if(codeMemorise){
    $('code-structure').value = codeMemorise;
    chargerTicketsSuivi().finally(() => {
      document.documentElement.classList.remove('deja-identifie');
      const v = $('voile-verification-precoce'); if(v) v.style.display = 'none';
    });
  }
}catch(e){}
</script>
</body>
</html>
